<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 565.133 375" width="565.133" height="375" style="--bg:#ffffff;--fg:#27292e;--line:#6b6f76;--accent:#1f5fd6;--surface:#ffffff;--border:#c9ccd1;background:var(--bg)">
<style>
  500;600;700&amp;display=swap');
  text { font-family: 'Inter', system-ui, sans-serif; }
  svg {
    /* Derived from --bg and --fg (overridable via --line, --accent, etc.) */
    --_text:          var(--fg);
    --_text-sec:      var(--muted, color-mix(in srgb, var(--fg) 60%, var(--bg)));
    --_text-muted:    var(--muted, color-mix(in srgb, var(--fg) 40%, var(--bg)));
    --_text-faint:    color-mix(in srgb, var(--fg) 25%, var(--bg));
    --_line:          var(--line, color-mix(in srgb, var(--fg) 50%, var(--bg)));
    --_arrow:         var(--accent, color-mix(in srgb, var(--fg) 85%, var(--bg)));
    --_node-fill:     var(--surface, color-mix(in srgb, var(--fg) 3%, var(--bg)));
    --_node-stroke:   var(--border, color-mix(in srgb, var(--fg) 20%, var(--bg)));
    --_group-fill:    var(--bg);
    --_group-hdr:     color-mix(in srgb, var(--fg) 5%, var(--bg));
    --_inner-stroke:  color-mix(in srgb, var(--fg) 12%, var(--bg));
    --_key-badge:     color-mix(in srgb, var(--fg) 10%, var(--bg));
  }
</style>
<defs>
  <marker id="seq-arrow" markerWidth="8" markerHeight="5" refX="8" refY="2.5" orient="auto-start-reverse">
    <polygon points="0 0, 8 2.5, 0 5" fill="var(--_arrow)" />
  </marker>
  <marker id="seq-arrow-open" markerWidth="8" markerHeight="5" refX="8" refY="2.5" orient="auto-start-reverse">
    <polyline points="0 0, 8 2.5, 0 5" fill="none" stroke="var(--_arrow)" stroke-width="1" />
  </marker>
</defs>
<line class="lifeline" data-actor="Customer" x1="75.133" y1="70" x2="75.133" y2="345" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<line class="lifeline" data-actor="Web" x1="215.13299999999998" y1="70" x2="215.13299999999998" y2="345" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<line class="lifeline" data-actor="API" x1="355.133" y1="70" x2="355.133" y2="345" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<line class="lifeline" data-actor="Bank" x1="495.133" y1="70" x2="495.133" y2="345" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<g class="message" data-from="Customer" data-to="Web" data-label="Place order" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="75.133" y1="90" x2="215.13299999999998" y2="90" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="145.13299999999998" y="80" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">Place order</text>
</g>
<g class="message" data-from="Web" data-to="API" data-label="POST /orders" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="215.13299999999998" y1="130" x2="355.133" y2="130" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="285.133" y="120" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">POST /orders</text>
</g>
<g class="message" data-from="API" data-to="Bank" data-label="Authorise payment" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="355.133" y1="170" x2="495.133" y2="170" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="425.133" y="160" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">Authorise payment</text>
</g>
<g class="message" data-from="Bank" data-to="API" data-label="Approved" data-line-style="dashed" data-arrow-head="filled" data-self="false">
  <line x1="495.133" y1="210" x2="355.133" y2="210" stroke="var(--_line)" stroke-width="1" stroke-dasharray="6 4" marker-end="url(#seq-arrow)" />
  <text x="425.133" y="200" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">Approved</text>
</g>
<g class="message" data-from="API" data-to="Web" data-label="201 Created" data-line-style="dashed" data-arrow-head="filled" data-self="false">
  <line x1="355.133" y1="250" x2="215.13299999999998" y2="250" stroke="var(--_line)" stroke-width="1" stroke-dasharray="6 4" marker-end="url(#seq-arrow)" />
  <text x="285.133" y="240" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">201 Created</text>
</g>
<g class="message" data-from="Web" data-to="Customer" data-label="Order confirmed" data-line-style="dashed" data-arrow-head="filled" data-self="false">
  <line x1="215.13299999999998" y1="290" x2="75.133" y2="290" stroke="var(--_line)" stroke-width="1" stroke-dasharray="6 4" marker-end="url(#seq-arrow)" />
  <text x="145.13299999999998" y="280" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">Order confirmed</text>
</g>
<g class="note" data-position="over" data-actors="Customer,Bank">
  <polygon points="209.64099999999996,298 354.625,298 360.625,304 360.625,321 209.64099999999996,321" fill="var(--bg)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <polygon points="354.625,298 360.625,304 354.625,304" fill="var(--_inner-stroke)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="285.133" y="309.5" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">One order, one transaction</text>
</g>
<g class="actor" data-id="Customer" data-label="Customer" data-type="actor">
  <g transform="translate(57.132999999999996,32) scale(1.5)">
    <path d="M21 12C21 16.9706 16.9706 21 12 21C7.02944 21 3 16.9706 3 12C3 7.02944 7.02944 3 12 3C16.9706 3 21 7.02944 21 12Z" fill="none" stroke="var(--_line)" stroke-width="0.6666666666666666" />
    <path d="M15 10C15 11.6569 13.6569 13 12 13C10.3431 13 9 11.6569 9 10C9 8.34315 10.3431 7 12 7C13.6569 7 15 8.34315 15 10Z" fill="none" stroke="var(--_line)" stroke-width="0.6666666666666666" />
    <path d="M5.62842 18.3563C7.08963 17.0398 9.39997 16 12 16C14.6 16 16.9104 17.0398 18.3716 18.3563" fill="none" stroke="var(--_line)" stroke-width="0.6666666666666666" />
  </g>
  <text x="75.133" y="84" font-size="13" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="4.55">Customer</text>
</g>
<g class="actor" data-id="Web" data-label="Web app" data-type="participant">
  <rect x="172.964" y="30" width="84.338" height="40" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="215.13299999999998" y="50" font-size="13" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="4.55">Web app</text>
</g>
<g class="actor" data-id="API" data-label="API gateway" data-type="participant">
  <rect x="302.2195" y="30" width="105.827" height="40" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="355.133" y="50" font-size="13" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="4.55">API gateway</text>
</g>
<g class="actor" data-id="Bank" data-label="Bank" data-type="participant">
  <rect x="455.133" y="30" width="80" height="40" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="495.133" y="50" font-size="13" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="4.55">Bank</text>
</g>
</svg>