<svg xmlns="http://www.w3.org/2000/svg" class="ursula" data-theme="band" viewBox="0 0 504 484" width="504" height="484" role="img"><title>Pie chart: Key elements in Product X</title><style>.ursula{font-family:'IBM Plex Sans KR', 'Apple SD Gothic Neo', 'Noto Sans KR', -apple-system, sans-serif}
.ursula-bg{fill:var(--ursula-surface,#fcfcfa)}
.ursula-panel{fill:var(--ursula-panel,none)}
.ursula-title{font:600 15px 'IBM Plex Sans KR', 'Apple SD Gothic Neo', 'Noto Sans KR', -apple-system, sans-serif;fill:var(--ursula-fg,#201f1e)}
.ursula-name{font:600 13px 'IBM Plex Sans KR', 'Apple SD Gothic Neo', 'Noto Sans KR', -apple-system, sans-serif;fill:var(--ursula-fg,#201f1e);text-anchor:middle}
.ursula-value{font:500 11px 'IBM Plex Sans KR', 'Apple SD Gothic Neo', 'Noto Sans KR', -apple-system, sans-serif;fill:var(--ursula-fg,#201f1e);text-anchor:middle;font-variant-numeric:tabular-nums;paint-order:stroke;stroke:var(--ursula-surface,#fcfcfa);stroke-width:3px;stroke-linejoin:round}
.ursula-start{text-anchor:start}
.ursula-middle{text-anchor:middle}
.ursula-end{text-anchor:end}
.ursula-guide{fill:none;stroke:var(--ursula-hair,#e2e1e0);stroke-width:1;stroke-linecap:round;stroke-linejoin:round}
.ursula-series-1--tint{fill:var(--ursula-s1-tint,#f1e7d2);stroke:var(--ursula-s1,#82641c);stroke-width:0}
.ursula-series-2--tint{fill:var(--ursula-s2-tint,#d2eef1);stroke:var(--ursula-s2,#007883);stroke-width:0}
.ursula-series-3--tint{fill:var(--ursula-s3-tint,#fce1de);stroke:var(--ursula-s3,#98524d);stroke-width:0}
.ursula-series-4--tint{fill:var(--ursula-s4-tint,#dceedc);stroke:var(--ursula-s4,#437746);stroke-width:0}
@media (prefers-color-scheme: dark){
.ursula{font-family:'IBM Plex Sans KR', 'Apple SD Gothic Neo', 'Noto Sans KR', -apple-system, sans-serif}
.ursula-bg{fill:var(--ursula-surface,#171614)}
