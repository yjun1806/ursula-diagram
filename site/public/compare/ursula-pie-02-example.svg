.ursula-middle{text-anchor:middle}
.ursula-end{text-anchor:end}
.ursula-guide{fill:none;stroke:var(--ursula-hair,#2c2b2a);stroke-width:1;stroke-linecap:round;stroke-linejoin:round}
.ursula-series-1--tint{fill:var(--ursula-s1-tint,#3f3112);stroke:var(--ursula-s1,#cdad69);stroke-width:0}
.ursula-series-2--tint{fill:var(--ursula-s2-tint,#093a3f);stroke:var(--ursula-s2,#5ec3ce);stroke-width:0}
