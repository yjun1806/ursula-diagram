.ursula-value{font:500 11px 'IBM Plex Sans KR', 'Apple SD Gothic Neo', 'Noto Sans KR', -apple-system, sans-serif;fill:var(--ursula-fg,#efeeec);text-anchor:middle;font-variant-numeric:tabular-nums;paint-order:stroke;stroke:var(--ursula-surface,#171614);stroke-width:3px;stroke-linejoin:round}
