<svg xmlns="http://www.w3.org/2000/svg" class="ursula" data-theme="band" viewBox="0 0 976 192" width="976" height="192" role="img"><title>Flowchart: 5 nodes, 5 edges</title><style>.ursula{background:var(--ursula-bg,transparent);font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif;font-size:12px}
.ursula-lane{fill:var(--ursula-surface,#fcfcfa);stroke:var(--ursula-hair,#e2e1e0);stroke-width:1}
.ursula-lane--tint{fill:var(--ursula-lane,#efeeed)}
.ursula-lane-label{fill:var(--ursula-fg,#201f1e);font-size:13px;font-weight:600}
.ursula-node-box{fill:var(--ursula-surface,#fcfcfa);stroke:var(--ursula-border,#484846);stroke-width:1.5}
.ursula-node--on-lane .ursula-node-box{fill:var(--ursula-surface,#fcfcfa)}
[data-role="start"] .ursula-node-box{fill:var(--ursula-start-fill,#e5c37a)}
[data-role="decision"] .ursula-node-box{fill:var(--ursula-surface,#fcfcfa)}
.ursula-node-title{fill:var(--ursula-fg,#201f1e);font-size:13px;font-weight:600}
.ursula-node-line{fill:var(--ursula-muted,#5b5b59);font-size:12px;font-weight:400}
[data-role="start"] .ursula-node-title{fill:var(--ursula-on-accent,#201f1e)}
[data-role="start"] .ursula-node-line{fill:var(--ursula-on-accent,#201f1e);fill-opacity:.8}
[data-role="decision"] .ursula-node-title{fill:var(--ursula-fg,#201f1e)}
[data-role="decision"] .ursula-node-line{fill:var(--ursula-fg,#201f1e);fill-opacity:.8}
.ursula-edge{fill:none;stroke:var(--ursula-line,#565554);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.ursula-edge--dotted{stroke-dasharray:5 4}
.ursula-arrow{fill:var(--ursula-line,#565554)}
.ursula-arrow--accent{fill:var(--ursula-line,#565554)}
.ursula-edge-label-bg{fill:var(--ursula-chip-fill,#f1f0ef)}
.ursula-edge-label{fill:var(--ursula-muted,#5b5b59);font-size:12px;font-weight:500}
.ursula-port{fill:var(--ursula-surface,#fcfcfa);stroke:var(--ursula-line,#565554);stroke-width:1.5}
.ursula-legend-rule{stroke:var(--ursula-hair,#e2e1e0);stroke-width:1}
.ursula-legend-text{fill:var(--ursula-muted,#5b5b59);font-size:12px;font-weight:400}
@media (prefers-color-scheme: dark){
.ursula{background:var(--ursula-bg,transparent);font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif;font-size:12px}
.ursula-lane{fill:var(--ursula-surface,#171614);stroke:var(--ursula-hair,#2c2b2a);stroke-width:1}
.ursula-lane--tint{fill:var(--ursula-lane,#252422)}
.ursula-lane-label{fill:var(--ursula-fg,#efeeec);font-size:13px;font-weight:600}
.ursula-node-box{fill:var(--ursula-surface,#171614);stroke:var(--ursula-border,#bebdbb);stroke-width:1.5}
.ursula-node--on-lane .ursula-node-box{fill:var(--ursula-surface,#171614)}
[data-role="start"] .ursula-node-box{fill:var(--ursula-start-fill,#dab975)}
[data-role="decision"] .ursula-node-box{fill:var(--ursula-surface,#171614)}
.ursula-node-title{fill:var(--ursula-fg,#efeeec);font-size:13px;font-weight:600}
.ursula-node-line{fill:var(--ursula-muted,#b2b1af);font-size:12px;font-weight:400}
[data-role="start"] .ursula-node-title{fill:var(--ursula-on-accent,#171614)}
[data-role="start"] .ursula-node-line{fill:var(--ursula-on-accent,#171614);fill-opacity:.8}
[data-role="decision"] .ursula-node-title{fill:var(--ursula-fg,#efeeec)}
[data-role="decision"] .ursula-node-line{fill:var(--ursula-fg,#efeeec);fill-opacity:.8}
.ursula-edge{fill:none;stroke:var(--ursula-line,#a5a4a2);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.ursula-edge--dotted{stroke-dasharray:5 4}
.ursula-arrow{fill:var(--ursula-line,#a5a4a2)}
.ursula-arrow--accent{fill:var(--ursula-line,#a5a4a2)}
.ursula-edge-label-bg{fill:var(--ursula-chip-fill,#252422)}
.ursula-edge-label{fill:var(--ursula-muted,#b2b1af);font-size:12px;font-weight:500}
.ursula-port{fill:var(--ursula-surface,#171614);stroke:var(--ursula-line,#a5a4a2);stroke-width:1.5}
.ursula-legend-rule{stroke:var(--ursula-hair,#2c2b2a);stroke-width:1}
.ursula-legend-text{fill:var(--ursula-muted,#b2b1af);font-size:12px;font-weight:400}
}</style><defs><marker id="ursula-arrow" viewBox="0 0 9 9" refX="1" refY="4.5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path class="ursula-arrow" d="M0 0L9 4.5L0 9z"/></marker><marker id="ursula-arrow-accent" viewBox="0 0 9 9" refX="1" refY="4.5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path class="ursula-arrow ursula-arrow--accent" d="M0 0L9 4.5L0 9z"/></marker></defs><path class="ursula-edge ursula-edge--normal" data-style="normal" data-from="order" data-to="pay" d="M156 120 L230.06 120" marker-end="url(#ursula-arrow)"/><path class="ursula-edge ursula-edge--normal ursula-edge--branch" data-style="normal" data-from="pay" data-to="pick" d="M268 92.06 L268 72 A8 8 0 0 1 276 64 L700 64 A8 8 0 0 1 708 72 L708 88" marker-end="url(#ursula-arrow-accent)"/><path class="ursula-edge ursula-edge--normal ursula-edge--branch" data-style="normal" data-from="pay" data-to="remind" d="M297.94 120 L332 120 A6 6 0 0 1 344 120 L460 120" marker-end="url(#ursula-arrow-accent)"/><path class="ursula-edge ursula-edge--normal" data-style="normal" data-from="remind" data-to="pay" d="M468 108 L346 108 A8 8 0 0 0 338 116 L338 168 A8 8 0 0 1 330 176 L276 176 A8 8 0 0 1 268 168 L268 155.94" marker-end="url(#ursula-arrow)"/><path class="ursula-edge ursula-edge--normal" data-style="normal" data-from="pick" data-to="ship" d="M772 120 L812 120" marker-end="url(#ursula-arrow)"/><g class="ursula-node" data-node="order" data-role="start"><rect class="ursula-node-box" x="28" y="96" width="128" height="48" rx="24"/><text class="ursula-node-title" x="92" y="120" text-anchor="middle" dominant-baseline="central">Order placed</text></g><g class="ursula-node" data-node="pay" data-role="decision"><path class="ursula-node-box" d="M275.97 95.09 L293.91 111.03 A12 12 0 0 1 293.91 128.97 L275.97 144.91 A12 12 0 0 1 260.03 144.91 L242.09 128.97 A12 12 0 0 1 242.09 111.03 L260.03 95.09 A12 12 0 0 1 275.97 95.09Z"/><text class="ursula-node-title" x="268" y="120" text-anchor="middle" dominant-baseline="central">Paid?</text></g><g class="ursula-node" data-node="pick"><rect class="ursula-node-box" x="644" y="96" width="128" height="48" rx="10"/><text class="ursula-node-title" x="708" y="120" text-anchor="middle" dominant-baseline="central">Pick items</text></g><g class="ursula-node" data-node="remind"><rect class="ursula-node-box" x="468" y="96" width="128" height="48" rx="10"/><text class="ursula-node-title" x="532" y="120" text-anchor="middle" dominant-baseline="central">Send reminder</text></g><g class="ursula-node" data-node="ship"><rect class="ursula-node-box" x="820" y="96" width="128" height="48" rx="24"/><text class="ursula-node-title" x="884" y="120" text-anchor="middle" dominant-baseline="central">Ship</text></g><circle class="ursula-port" cx="156" cy="120" r="4"/><circle class="ursula-port" cx="268" cy="92.06" r="4"/><circle class="ursula-port" cx="297.94" cy="120" r="4"/><circle class="ursula-port" cx="468" cy="108" r="4"/><circle class="ursula-port" cx="772" cy="120" r="4"/><g class="ursula-edge-label-group" data-from="pay" data-to="pick"><rect class="ursula-edge-label-bg" x="468" y="52" width="40.52" height="24" rx="12"/><text class="ursula-edge-label ursula-edge-label--branch" x="488.26" y="64" text-anchor="middle" dominant-baseline="central">yes</text></g><g class="ursula-edge-label-group" data-from="pay" data-to="remind"><rect class="ursula-edge-label-bg" x="380" y="108" width="33.68" height="24" rx="12"/><text class="ursula-edge-label ursula-edge-label--branch" x="396.84" y="120" text-anchor="middle" dominant-baseline="central">no</text></g></svg>
