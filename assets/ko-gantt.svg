<svg xmlns="http://www.w3.org/2000/svg" class="ursula" data-theme="band" viewBox="0 0 1356 320" width="1356" height="320" role="img"><title>gantt — 출시</title><style>.ursula{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif}
.ursula-bg{fill:var(--ursula-surface,#fcfcfa)}
