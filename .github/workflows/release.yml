name: Release

# Push a tag such as v0.1.1 whose version matches package.json. The package is published to npm through trusted
# publishing (no token), with provenance, and a GitHub release is made for the tag.
on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - uses: oven-sh/setup-bun@v2
      - run: npm install -g npm@latest
      - run: bun install --frozen-lockfile
      - name: The tag matches the version
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - run: npx tsc --noEmit
      - run: npm test
      - run: bun scripts/build.ts
      - name: The command inside the skill matches the sources
        run: git diff --exit-code -- skills/
      - run: npm publish --provenance
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
