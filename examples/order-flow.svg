central">Ship</text></g><g class="ursula-node" data-node="R"><rect class="ursula-node-box" x="616.64" y="240" width="88" height="58" rx="8"/><text class="ursula-node-title" x="660.64" y="269" text-anchor="middle" dominant-baseline="central">Restock</text></g><g class="ursula-edge-label-group" data-from="B" data-to="D"><rect class="ursula-edge-label-bg" x="287.2" y="106" width="34.88" height="20" rx="3"/><text class="ursula-edge-label" x="304.64" y="116" text-anchor="middle" dominant-baseline="central">paid</text></g></svg>
