.ursula-edge-label--thick{fill:var(--ursula-accent,#2563eb)}
.ursula-legend-rule{stroke:var(--ursula-hair,#e5e7eb);stroke-width:1}
.ursula-legend-text{fill:var(--ursula-muted,#6b7280);font-size:12px;font-weight:400}
