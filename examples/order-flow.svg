<svg xmlns="http://www.w3.org/2000/svg" class="ursula" viewBox="0 0 964.64 330" width="964.64" height="330" role="img"><style>.ursula{background:var(--ursula-bg,transparent);font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif;font-size:12px}
.ursula-lane{fill:var(--ursula-lane,#f3f4f6);stroke:var(--ursula-border,#d1d5db);stroke-width:1}
.ursula-lane-label{fill:var(--ursula-muted,#6b7280);font-size:12px;font-weight:600}
.ursula-node-box{fill:var(--ursula-surface,#ffffff);stroke:var(--ursula-border,#d1d5db);stroke-width:1}
.ursula-node-title{fill:var(--ursula-fg,#1f2937);font-size:13px;font-weight:600}
.ursula-node-line{fill:var(--ursula-muted,#6b7280);font-size:12px}
.ursula-edge{fill:none;stroke:var(--ursula-line,#9ca3af);stroke-width:1.25}
.ursula-edge--thick{stroke:var(--ursula-accent,#2563eb);stroke-width:1.5}
.ursula-edge--dotted{stroke-dasharray:5 4}
.ursula-arrow{fill:var(--ursula-line,#9ca3af)}
.ursula-arrow--accent{fill:var(--ursula-accent,#2563eb)}
.ursula-edge-label-bg{fill:var(--ursula-surface,#ffffff)}
.ursula-edge-label{fill:var(--ursula-muted,#6b7280);font-size:12px}
@media (prefers-color-scheme: dark){
.ursula{background:var(--ursula-bg,transparent);font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif;font-size:12px}
.ursula-lane{fill:var(--ursula-lane,#161b22);stroke:var(--ursula-border,#4b5563);stroke-width:1}
.ursula-lane-label{fill:var(--ursula-muted,#9ca3af);font-size:12px;font-weight:600}
.ursula-node-box{fill:var(--ursula-surface,#1f2937);stroke:var(--ursula-border,#4b5563);stroke-width:1}
.ursula-node-title{fill:var(--ursula-fg,#e5e7eb);font-size:13px;font-weight:600}
.ursula-node-line{fill:var(--ursula-muted,#9ca3af);font-size:12px}
.ursula-edge{fill:none;stroke:var(--ursula-line,#6b7280);stroke-width:1.25}
.ursula-edge--thick{stroke:var(--ursula-accent,#60a5fa);stroke-width:1.5}
.ursula-edge--dotted{stroke-dasharray:5 4}
.ursula-arrow{fill:var(--ursula-line,#6b7280)}
.ursula-arrow--accent{fill:var(--ursula-accent,#60a5fa)}
.ursula-edge-label-bg{fill:var(--ursula-surface,#1f2937)}
.ursula-edge-label{fill:var(--ursula-muted,#9ca3af);font-size:12px}
}</style><defs><marker id="ursula-arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path class="ursula-arrow" d="M0 1L10 5L0 9z"/></marker><marker id="ursula-arrow-accent" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path class="ursula-arrow ursula-arrow--accent" d="M0 1L10 5L0 9z"/></marker></defs><g class="ursula-lane-group" data-lane="shop"><rect class="ursula-lane" x="12" y="12" width="940.64" height="98" rx="12"/><text class="ursula-lane-label" x="20" y="40" dominant-baseline="central">Storefront</text></g><g class="ursula-lane-group" data-lane="wh"><rect class="ursula-lane" x="12" y="122" width="940.64" height="196" rx="12"/><text class="ursula-lane-label" x="20" y="150" dominant-baseline="central">Warehouse</text></g><path class="ursula-edge ursula-edge--normal" data-from="A" data-to="B" d="M204.64 61 L260.64 61" marker-end="url(#ursula-arrow)"/><path class="ursula-edge ursula-edge--normal" data-from="B" data-to="C" d="M348.64 61 L404.64 61" marker-end="url(#ursula-arrow)"/><path class="ursula-edge ursula-edge--normal" data-from="D" data-to="E" d="M356.64 171 L444.64 171" marker-end="url(#ursula-arrow)"/><path class="ursula-edge ursula-edge--normal" data-from="E" data-to="H" d="M508.64 171 L596.64 171" marker-end="url(#ursula-arrow)"/><path class="ursula-edge ursula-edge--normal" data-from="H" data-to="F" d="M724.64 171 L820.64 171" marker-end="url(#ursula-arrow)"/><path class="ursula-edge ursula-edge--thick" data-from="B" data-to="D" d="M304.64 90 L304.64 142" marker-end="url(#ursula-arrow-accent)"/><path class="ursula-edge ursula-edge--normal" data-from="F" data-to="G" d="M852.64 142 L852.64 90" marker-end="url(#ursula-arrow)"/><path class="ursula-edge ursula-edge--dotted" data-from="E" data-to="R" d="M508.64 185.5 L564.64 185.5 A8 8 0 0 1 572.64 193.5 L572.64 261 A8 8 0 0 0 580.64 269 L616.64 269" marker-end="url(#