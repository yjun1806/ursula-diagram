.ursula-lane--tint{fill:var(--ursula-lane,#252422)}
.ursula-lane-label{fill:var(--ursula-fg,#efeeec);font-size:13px;font-weight:600}
.ursula-node-box{fill:var(--ursula-surface,#171614);stroke:var(--ursula-border,#bebdbb);stroke-width:1.5}
.ursula-node--on-lane .ursula-node-box{fill:var(--ursula-surface,#171614)}
[data-role="start"] .ursula-node-box{fill:var(--ursula-start-fill,#dab975)}
[data-role="decision"] .ursula-node-box{fill:var(--ursula-surface,#171614)}
.ursula-node-title{fill:var(--ursula-fg,#efeeec);font-size:13px;font-weight:600}
.ursula-node-line{fill:var(--ursula-muted,#b2b1af);font-size:12px;font-weight:400}
[data-role="start"] .ursula-node-title{fill:var(--ursula-on-accent,#171614)}
[data-role="start"] .ursula-node-line{fill:var(--ursula-on-accent,#171614);fill-opacity:.8}
[data-role="decision"] .ursula-node-title{fill:var(--ursula-fg,#efeeec)}
[data-role="decision"] .ursula-node-line{fill:var(--ursula-fg,#efeeec);fill-opacity:.8}
.ursula-edge{fill:none;stroke:var(--ursula-line,#a5a4a2);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.ursula-edge--dotted{stroke-dasharray:5 4}
.ursula-arrow{fill:var(--ursula-line,#a5a4a2)}
.ursula-arrow--accent{fill:var(--ursula-line,#a5a4a2)}
.ursula-edge-label-bg{fill:var(--ursula-chip-fill,#252422)}
.ursula-edge-label{fill:var(--ursula-muted,#b2b1af);font-size:12px;font-weight:500}
.ursula-port{fill:var(--ursula-surface,#171614);stroke:var(--ursula-line,#a5a4a2);stroke-width:1.5}
.ursula-legend-rule{stroke:var(--ursula-hair,#2c2b2a);stroke-width:1}
.ursula-legend-text{fill:var(--ursula-muted,#b2b1af);font-size:12px;font-weight:400}
}</style><defs><marker id="ursula-arrow" viewBox="0 0 9 9" refX="1" refY="4.5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path class="ursula-arrow" d="M0 0L9 4.5L0 9z"/></marker><marker id="ursula-arrow-accent" viewBox="0 0 9 9" refX="1" refY="4.5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path class="ursula-arrow ursula-arrow--accent" d="M0 0L9 4.5L0 9z"/></marker></defs><g class="ursula-lane-group" data-lane="shop"><rect class="ursula-lane ursula-lane--tint" x="16" y="16" width="1144" height="144" rx="14"/><text class="ursula-lane-label" x="32" y="40" dominant-baseline="central">Storefront</text></g><g class="ursula-lane-group" data-lane="wh"><rect class="ursula-lane" x="16" y="168" width="1144" height="264" rx="14"/><text class="ursula-lane-label" x="32" y="192" dominant-baseline="central">Warehouse</text></g><path class="ursula-edge ursula-edge--normal" data-style="normal" data-from="A" data-to="B" d="M296 80 L336 80" marker-end="url(#ursula-arrow)"/><path class="ursula-edge ursula-edge--normal" data-style="normal" data-from="B" data-to="C" d="M504 80 L544 80" marker-end="url(#ursula-arrow)"/><path class="ursula-edge ursula-edge--normal" data-style="normal" data-from="D" data-to="E" d="M504 256 L544 256" marker-end="url(#ursula-arrow)"/><path class="ursula-edge ursula-edge--normal" data-style="normal" data-from="E" data-to="H" d="M712 256 L752 256" marker-end="url(#ursula-arrow)"/><path class="ursula-edge ursula-edge--normal" data-style="normal" data-from="H" data-to="F" d="M920 256 L960 256" marker-end="url(#ursula-arrow)"/><path class="ursula-edge ursula-edge--thick" data-style="thick" data-from="B" data-to="D" d="M424 112 L424 216" marker-end="url(#ursula-arrow-accent)"/><path class="ursula-edge ursula-edge--normal" data-style="normal" data-from="F" data-to="G" d="M1048 224 L1048 120" marker-end="url(#ursula-arrow)"/><path class="ursula-edge ursula-edge--dotted" data-style="dotted" data-from="E" data-to="R" d="M632 288 L632 328" marker-end="url(#ursula-arrow)"/><g class="ursula-node" data-node="A" data-role="start"><rect class="ursula-node-box" x="136" y="48" width="160" height="64" rx="10"/><text class="ursula-node-title" x="216" y="80" text-anchor="middle" dominant-baseline="central">주문 접수</text></g><g class="ursula-node ursula-node--on-lane" data-node="B"><rect class="ursula-node-box" x="344" y="48" width="160" height="64" rx="10"/><text class="ursula-node-title" x="424" y="80" text-anchor="middle" dominant-baseline="central">결제 확인</text></g><g class="ursula-node ursula-node--on-lane" data-node="C"><rect class="ursula-node-box" x="552" y="48" width="160" height="64" rx="10"/><text class="ursula-node-title" x="632" y="72" text-anchor="middle" dominant-baseline="central">Order confirmed</text><text class="ursula-node-line" x="632" y="89" text-anchor="middle" dominant-baseline="central">email sent</text></g><g class="ursula-node ursula-node--on-lane" data-node="G"><rect class="ursula-node-box" x="968" y="48" width="160" height="64" rx="10"/><text class="ursula-node-title" x="1048" y="80" text-anchor="middle" dominant-baseline="central">Customer notified</text></g><g class="ursula-node" data-node="D"><rect class="ursula-node-box" x="344" y="224" width="160" height="64" rx="10"/><text class="ursula-node-title" x="424" y="256" text-anchor="middle" dominant-baseline="central">Pick items</text></g><g class="ursula-node" data-node="E"><rect class="ursula-node-box" x="552" y="224" width="160" height="64" rx="10"/><text class="ursula-node-title" x="632" y="256" text-anchor="middle" dominant-baseline="central">Pack</text></g><g class="ursula-node" data-node="H"><rect class="ursula-node-box" x="760" y="224" width="160" height="64" rx="10"/><text class="ursula-node-title" x="840" y="256" text-anchor="middle" dominant-baseline="central">Quality check</text></g><g class="ursula-node" data-node="F"><rect class="ursula-node-box" x="968" y="224" width="160" height="64