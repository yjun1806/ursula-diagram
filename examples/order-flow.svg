}</style><defs><marker id="ursula-arrow" viewBox="0 0 8 6" refX="8" refY="3" markerWidth="8" markerHeight="6" markerUnits="userSpaceOnUse" orient="auto"><path class="ursula-arrow" d="M0 0L8 3L0 6z"/></marker><marker id="ursula-arrow-accent" viewBox="0 0 8 6" refX="8" refY="3" markerWidth="8" markerHeight="6" markerUnits="userSpaceOnUse" orient="auto"><path class="ursula-arrow ursula-arrow--accent" d="M0 0L8 3L0 6z"/></marker></defs><g class="ursula-lane-group" data-lane="shop"><rect class="ursula-lane ursula-lane--tint" x="12" y="12" width="966.08" height="98" rx="8"/><text class="ursula-lane-label" x="20" y="40" dominant-baseline="central">Storefront</text></g><g class="ursula-lane-group" data-lane="wh"><rect class="ursula-lane" x="12" y="114" width="966.08" height="196" rx="8"/><text class="ursula-lane-label" x="20" y="142" dominant-baseline="central">Warehouse</text></g><path class="ursula-edge ursula-edge--normal" data-style="normal" data-from="A" data-to="B" d="M246.08 61 L286.08 61" marker-end="url(#ursula-arrow)"/><path class="ursula-edge ursula-edge--normal" data-style="normal" data-from="B" data-to="C" d="M414.08 61 L454.08 61" marker-end="url(#ursula-arrow)"/><path class="ursula-edge ursula-edge--normal" data-style="normal" data-from="D" data-to="E" d="M414.08 163 L462.08 163" marker-end="url(#ursula-arrow)"/><path class="ursula-edge ursula-edge--normal" data-style="normal" data-from="E" data-to="H" d="M590.08 163 L638.08 163" marker-end="url(#ursula-arrow)"/><path class="ursula-edge ursula-edge--normal" data-style="normal" data-from="H" data-to="F" d="M766.08 163 L818.08 163" marker-end="url(#ursula-arrow)"/><path class="ursula-edge ursula-edge--thick" data-style="thick" data-from="B" data-to="D" d="M350.08 90 L350.08 134" marker-end="url(#ursula-arrow-accent)"/><path class="ursula-edge ursula-edge--normal" data-style="normal" data-from="F" data-to="G" d="M882.08 134 L882.08 90" marker-end="url(#ursula-arrow)"/><path class="ursula-edge ursula-edge--dotted