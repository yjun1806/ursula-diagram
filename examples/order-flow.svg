<svg xmlns="http://www.w3.org/2000/svg" class="ursula" viewBox="0 0 990.08 354" width="990.08" height="354" role="img"><title>Flowchart: 9 nodes, 8 edges</title><style>.ursula{background:var(--ursula-bg,transparent);font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif;font-size:12px}
.ursula-lane{fill:var(--ursula-surface,#ffffff);stroke:var(--ursula-hair,#e5e7eb);stroke-width:1}
.ursula-lane--tint{fill:var(--ursula-lane,#f3f4f6)}
