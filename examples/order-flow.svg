<svg xmlns="http://www.w3.org/2000/svg" class="ursula" viewBox="0 0 1272 448" width="1272" height="448" role="img"><title>Flowchart: 9 nodes, 8 edges</title><style>.ursula{background:var(--ursula-bg,transparent);font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif;font-size:12px}
.ursula-lane{fill:var(--ursula-surface,#ffffff);stroke:var(--ursula-hair,#e5e7eb);stroke-width:1}
.ursula-lane--tint{fill:var(--ursula-lane,#f3f4f6)}
.ursula-lane-label{fill:var(--ursula-muted,#6b7280);font-size:12px;font-weight:600}
.ursula-node-box{fill:var(--ursula-surface,#ffffff);stroke:var(--ursula-border,#d1d5db);stroke-width:1}
.ursula-node-title{fill:var(--ursula-fg,#1f2937);font-size:13px;font-weight:600}
.ursula-node-line{fill:var(--ursula-muted,#6b7280);font-size:12px;font-weight:400}
.ursula-edge{fill:none;stroke:var(--ursula-line,#9ca3af);stroke-width:1.2}
.ursula-edge--thick{stroke:var(--ursula-accent,#2563eb)}
.ursula-edge--dotted{stroke-dasharray:5 4}
.ursula-arrow{fill:var(--ursula-line,#9ca3af)}
.ursula-arrow--accent{fill:var(--ursula-accent,#2563eb)}
.ursula-edge-label-bg{fill:var(--ursula-surface,#ffffff)}
.ursula-edge-label{fill:var(--ursula-muted,#6b7280);font-size:12px;font-weight:500}
.ursula-edge-label--thick{fill:var(--ursula-accent,#2563eb)}
.ursula-legend-rule{stroke:var(--ursula-hair,#e5e7eb);stroke-width:1}
.ursula-legend-text{fill:var(--ursula-muted,#6b7280);font-size:12px;font-weight:400}
@media (prefers-color-scheme: dark){
.ursula{background:var(--ursula-bg,transparent);font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif;font-size:12px}
.ursula-lane{fill:var(--ursula-surface,#1f2937);stroke:var(--ursula-hair,#2d333b);stroke-width:1}
.ursula-lane--tint{fill:var(--ursula-lane,#161b22)}
.ursula-lane-label{fill:var(--ursula-muted,#9ca3af);font-size:12px;font-weight:600}
.ursula-node-box{fill:var(--ursula-surface,#1f2937);stroke:var(--ursula-border,#4b5563);stroke-width:1}
.ursula-node-title{fill:var(--ursula-fg,#e5e7eb);font-size:13px;font-weight:600}
.ursula-node-line{fill:var(--ursula-muted,#9ca3af);font-size:12px;font-weight:400}
.ursula-edge{fill:none;stroke:var(--ursula-line,#6b7280);stroke-width:1.2}
.ursula-edge--thick{stroke:var(--ursula-accent,#60a5fa)}
.ursula-edge--dotted{stroke-dasharray:5 4}
.ursula-arrow{fill:var(--ursula-line,#6b7280)}
.ursula-arrow--accent{fill:var(--ursula-accent,#60a5fa)}
.ursula-edge-label-bg{fill:var(--ursula-surface,#1f2937)}
.ursula-edge-label{fill:var(--ursula-muted,#9ca3af);font-size:12px;font-weight:500}
.ursula-edge-label--thick{fill:var(--ursula-accent,#60a5fa)}
.ursula-legend-rule{stroke:var(--ursula-hair,#2d333b);stroke-width:1}
.ursula-legend-text{fill:var(--ursula-muted,#9ca3af);font-size:12px;font-weight:400}
}</style><defs><marker id="ursula-arrow" viewBox="0 0 8 6" refX="8" refY="3" markerWidth="8" markerHeight="6" markerUnits="userSpaceOnUse" orient="auto"><path class="ursula-arrow" d="M0 0L8 3L0 6z"/></marker><marker id="ursula-arrow-accent" viewBox="0 0 8 6" refX="8" refY="3" markerWidth="8" markerHeight="6" markerUnits="userSpaceOnUse" orient="auto"><path class="ursula-arrow ursula-arrow--accent" d="M0 0L8 3L0 6z"/></marker></defs><g class="ursula-lane-group" data-lane="shop"><rect class="ursula-lane ursula-lane--tint" x="16" y="16" width="1240" height="128" rx="8"/><text class="ursula-lane-label" x="24" y="56" dominant-baseline="central">Storefront</text></g><g class="ursula-lane-group" data-lane="wh"><rect class="ursula-lane" x="16" y="160" width="1240" height="240" rx="8"/><text class="ursula-lane-label" x="24" y="200" dominant-baseline="central">Warehouse</text></g><path class="ursula-edge ursula-edge--normal" data-style="normal" data-from="A" data-to="B" d="M264 80 L328 80" marker-end="url(#ursula-arrow)"/><path class="ursula-edge ursula-edge--normal" data-style="normal" data-from="B" data-to="C" d="M456 80 L520 80" marker-end="url(#ursula-arrow)"/><path class="ursula-edge ursula-edge--normal" data-style="normal" data-from="D" data-to="E" d="M456 224 L520 224" marker-end="url(#ursula-arrow)"/><path class="ursula-edge ursula-edge--normal" data-style="normal" data-from="E" data-to="H" d="M648 224 L712 224" marker-end="url(#ursula-arrow)"/><path class="ursula-edge ursula-edge--normal" data-style="normal" data-from="H" data-to="F" d="M840 224 L904 224" marker-end="url(#ursula-arrow)"/><path class="ursula-edge ursula-edge--thick" data-style="thick" data-from="B" data-to="D" d="M392 112 L392 192" marker-end="url(#ursula-arrow-accent)"/><path class="ursula-edge ursula-edge--normal" data-style="normal" data-from="F" data-to="G" d="M1016 192 L1016 112" marker-end="url(#ursula-arrow)"/><path class="ursula-edge ursula-edge--dotted" data-style="dotted" data-from="E" data-to="R" d="M584 256 L584 304" marker-end="url(#ursula-arrow)"/><g class="ursula-node" data-node="A"><rect class="ursula-node-box" x="136" y="48" width="128" height="64" rx="6"/><text class="ursula-node-title" x="200" y="80" text-anchor="middle" dominant-baseline="central">주문 접수</text></g><g class="ursula-node" data-node="B"><rect class="ursula-node-box" x="328" y="48" width="128" height="64" rx="6"/><text class="ursula-node-title" x="392" y="80" text-anchor="middle" dominant-baseline="central">결제 확인</text></g><g class="ursula-node" data-node="C"><rect class="ursula-node-box" x="520" y="48" width="320" height="64" rx="6"/><text class="ursula-node-title" x="680" y="72" text-anchor="middle" dominant-baseline="central">Order confirmed</text><text class="ursula-node-line" x="680" y="89" text-anchor="middle" dominant-baseline="central">email sent</text></g><g class="ursula-node" data-node="G"><rect class="ursula-node-box" x="904" y="48" width="320" height="64" rx="6"/><text class="ursula-node-title" x="1064" y="80" text-anchor="middle" dominant-baseline="central">Customer notified</text></g><g class="ursula-node" data-node="D"><rect class="ursula-node-box" x="328" y="192" width="128" height="64" rx="6"/><text class="ursula-node-title" x="392" y="224" text-anchor="middle" dominant-baseline="central">Pick items</text></g><g class="ursula-node" data-node="E"><rect class="ursula-node-box" x="520" y="192" width="128" height="64" rx="6"/><text class="ursula-node-title" x="584" y="224" text-anchor="middle" dominant-baseline="central">Pack</text></g><g class="ursula-node" data-node="H"><rect class="ursula-node-box" x="712" y="192" width="128" height="64" rx="6"/><text class="ursula-node-title" x="776" y="224" text-anchor="middle" dominant-baseline="central">Quality check</text></g><g class="ursula-node" data-node="F"><rect class="ursula-node-box" x="904" y="192" width="128" height="64" rx="6"/><text class="ursula-node-title" x="968" y="224" text-anchor="middle" dominant-baseline="central">Ship</text></g><g class="ursula-node" data-node="R"><rect class="ursula-node-box" x="520" y="304" width="128" height="64" rx="6"/><text class="ursula-node-title" x="584" y="336" text-anchor="middle" dominant-baseline="central">Restock</text></g><g class="ursula-edge-label-group" data-from="B" data-to="D"><rect class="ursula-edge-label-bg" x="396" y="142" width="32.48" height="20" rx="3"/><text class="ursula-edge-label ursula-edge-label--thick" x="412.24" y="152" text-anchor="middle" dominant-baseline="central">paid</text></g><g class="ursula-legend"><line class="ursula-legend-rule" x1="16" y1="416" x2="1256" y2="416"/><path class="ursula-edge ursula-edge--normal" d="M16 432 L56 432" marker-end="url(#ursula-arrow)"/><text class="ursula-legend-text" x="64" y="432" dominant-baseline="central">Flow</text><path class="ursula-edge ursula-edge--thick" d="M114.16 432 L154.16 432" marker-end="url(#ursula-arrow-accent)"/><text class="ursula-legend-text" x="162.16" y="432" dominant-baseline="central">Request</text><path class="ursula-edge ursula-edge--dotted" d="M235.72 432 L275.72 432" marker-end="url(#ursula-arrow)"/><text class="ursula-legend-text" x="283.72" y="432" dominant-baseline="central">Pending</text></g></svg>
