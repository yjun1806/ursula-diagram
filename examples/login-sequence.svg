idth="72" height="36" rx="6" data-participant="User"/><rect class="ursula-box ursula-box--box" x="188" y="20" width="88" height="36" rx="6" data-participant="Web"/><rect class="ursula-box ursula-box--box" x="332" y="20" width="96" height="36" rx="6" data-participant="API"/><rect class="ursula-box ursula-box--box" x="500" y="20" width="112" height="36" rx="6" data-participant="DB"/><rect class="ursula-box ursula-box--box" x="708" y="20" width="120" height="36" rx="6" data-participant="Mail"/><rect class="ursula-box ursula-box--note" x="564" y="296" width="196" height="32" rx="2" data-note="0"/><rect class="ursula-box ursula-box--note" x="44" y="624" width="200" height="32" rx="2" data-note="1"/><text class="ursula-text ursula-text--title" x="56" y="38" text-anchor="middle" dominant-baseline="central">사용자</text><text class="ursula-text ursula-text--title" x="232" y="38" text-anchor="middle" dominant-baseline="central">Web App</text><text class="ursula-text ursula-text--title" x="380" y="38" text-anchor="middle" dominant-baseline="central">Auth API</text><text class="ursula-text ursula-text--title" x="556" y="38" text-anchor="middle" dominant-baseline="central">User Store</text><text class="ursula-text ursula-text--title" x="768" y="38" text-anchor="middle" dominant-baseline="central">Mail Service</text><text class="ursula-text ursula-text--muted ursula-text--label ursula-text--halo" x="144" y="84" text-anchor="middle" dominant-baseline="central" data-message="0">1. Open login page</text><text class="ursula-text ursula-text--muted ursula-text--label ursula-text--halo" x="144" y="116" text-anchor="middle" dominant-baseline="central" data-message="1">2. Show form</text><text class="ursula-text ursula-text--muted ursula-text--label ursula-text--halo" x="144" y="148" text-anchor="middle" dominant-baseline="central" data-message="2">3. Submit credentials</text><text class="ursula-text ursula-text--muted ursula-text--label ursula-text--halo" x="308" y="180" text-anchor="middle" dominant-baseline="central" data-message="3">4. POST /login</text><text class="ursula-text ursula-text--muted ursula-text--label ursula-text--halo" x="424" y="212" text-anchor="start" dominant-baseline="central" data-message="4">5. Hash password</text><text class="ursula-text ursula-text--muted ursula-text--label ursula-text--halo" x="468" y="244" text-anchor="middle" dominant-baseline="central" data-message="5">6. Find user by email</text><text class="ursula-text ursula-text--muted ursula-text--label ursula-text--halo" x="468" y="276" text-anchor="middle" dominant-baseline="central" data-message="6">7. User record</text><text class="ursula-text ursula-text--muted" x="576" y="312" text-anchor="start" dominant-baseline="central">Lookups are cached for 60 s</text><text class="ursula-text ursula-text--muted ursula-text--label ursula-text--halo" x="308" y="376" text-anchor="middle" dominant-baseline="central" data-message="7">8. Session token</text><text class="ursula-text ursula-text--muted ursula-text--label ursula-text--halo" x="144" y="408" text-anchor="middle" dominant-baseline="central" data-message="8">9. Redirect to dashboard</text><text class="ursula-text ursula-text--muted ursula-text--label ursula-text--halo" x="576" y="464" text-anchor="middle" dominant-baseline="central" data-message="9">10. Send lock notice</text><text class="ursula-text ursula-text--muted ursula-text--label ursula-text--halo" x="308" y="496" text-anchor="middle" dominant-baseline="central" data-message="10">11. 423 Locked</text><text class="ursula-text ursula-text--muted ursula-text--label ursula-text--halo" x="144" y="528" text-anchor="middle" dominant-baseline="central" data-message="11">12. 계정이 잠겼습니다</text><text class="ursula-text ursula-text--muted ursula-text--label ursula-text--halo" x="84" y="342" text-anchor="start" dominant-baseline="central">[Password matches]</text><text class="ursula-text ursula-text--muted ursula-text--label ursula-text--halo" x="48" y="436" text-anchor="start" dominant-baseline="central">[Too many failures]</text><text class="ursula-text ursula-text--muted ursula-text--label ursula-text--halo" x="308" y="596" text-anchor="middle" dominant-baseline="central" data-message="12">13. Refresh session</text><text class="ursula-text ursula-text--muted ursula-text--label ursula-text--halo" x="268" y="562" text-anchor="start" dominant-baseline="central">[Every 5 minutes]</text><text class="ursula-text ursula-text--muted" x="144" y="640" text-anchor="middle" dominant-baseline="central">Session ends on logout</text></svg>
