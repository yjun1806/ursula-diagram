<svg xmlns="http://www.w3.org/2000/svg" class="ursula" viewBox="0 0 848 696" width="848" height="696" role="img"><title>Sequence diagram: 5 participants, 13 messages</title><style>.ursula{background:var(--ursula-bg,transparent);font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif;font-size:12px}
